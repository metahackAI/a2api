name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with all extras
        run: python -m pip install -e ".[mcp,openapi,source]"
      - name: Unit tests
        run: python -m unittest discover -s tests

  wheel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import a2api; print(a2api.__version__ if hasattr(a2api, '__version__') else 'ok')"
          /tmp/check/bin/a2api --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
