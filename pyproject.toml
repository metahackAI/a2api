[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2api"
version = "0.1.0"
description = "Capability contracts and a read-only HTTP composition runtime for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.19,<5"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
openapi = ["PyYAML>=6.0.2,<7"]

[project.scripts]
a2api = "a2api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a2api = ["schemas/*.json", "sample/*.json"]
