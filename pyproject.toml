[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2api"
version = "0.1.0"
description = "Lightweight capability protocol, explicit conversion and HTTP calls for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.19,<5"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
openapi = ["PyYAML>=6.0.2,<7"]
source = ["tree-sitter>=0.25,<0.27", "tree-sitter-java>=0.23,<0.24", "tree-sitter-go>=0.25,<0.26", "tree-sitter-rust>=0.24,<0.25"]

[project.scripts]
a2api = "a2api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a2api = ["schemas/*.json", "sample/*.json"]
